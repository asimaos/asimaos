# Partition 2: LUKS2 (default) -> Btrfs pool with the 11 Asima OS subvolumes
[Partition]
Type=linux-generic
Label=crypt_pool
Format=btrfs
Encrypt=key-file
CopyFiles=/pool:/
MakeDirectories=/@slots /@data /@reserve /@var /@containers /@vm /@flatpak /@nix /@home /@root /@snapshots
Subvolumes=/@slots /@data /@reserve /@var /@containers /@vm /@flatpak /@nix /@home /@root /@snapshots
SizeMinBytes=6G
