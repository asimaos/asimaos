# Asima OS system settings ("-" = skip quietly where the kernel or CPU doesn't have it).

# Games that trigger split locks are otherwise slowed down on purpose (Intel, Linux 6.2+) (D26).
-kernel.split_lock_mitigate = 0

# Swap is zram (compressed memory): swapping is cheap, so the kernel may use it early, and reads
# from it never need read-ahead (the values the Arch Wiki gives for zram).
vm.swappiness = 180
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.page-cluster = 0
