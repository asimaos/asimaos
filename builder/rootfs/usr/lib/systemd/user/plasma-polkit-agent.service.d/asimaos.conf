# Asima OS: the Asima OS password dialog (D37), with fingerprint and face buttons, runs in place of
# KDE's agent. If polkit refuses its registration it starts KDE's agent itself; if it keeps
# failing, systemd starts KDE's agent instead (OnFailure), so password dialogs always work.
# KDE's unit names a bus name only its own agent takes: reset it, or systemd would wait for it.
[Unit]
OnFailure=asimaos-polkit-agent-fallback.service

[Service]
Type=simple
BusName=
ExecStart=
ExecStart=/usr/lib/asimaos/asimaos-polkit-agent
