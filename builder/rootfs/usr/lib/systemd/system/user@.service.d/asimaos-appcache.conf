# Asima OS (D55): each person's own folder in the memory place for Flatpak apps' caches, made as
# they sign in (only they can open it). Unused unless they switch it on in Asima App Center.
[Unit]
Wants=run-asimaos-appcache.mount
After=run-asimaos-appcache.mount

[Service]
ExecStartPre=-+/usr/bin/install -d -m 0700 -o %i /run/asimaos/appcache/%i
