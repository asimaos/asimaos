# Asima OS: the ESP is not mounted for the desktop; this service opens it for itself,
# in its own mount namespace. The mount and the program must be one process (asimaos-esp execs it).
[Service]
PrivateMounts=yes
ExecStart=
ExecStart=/usr/lib/asimaos/asimaos-esp /usr/lib/systemd/systemd-bless-boot good
