# Asima OS (D55): the system's virtual machine disks are written without copy-on-write, as virtual
# machine disks should be on Btrfs (new files in the folder; Asima Dev's own are in each person's
# ~/.local/share/libvirt/images, set up by asimaos-dev-storage).
d /var/lib/libvirt/images 0711 root root -
h /var/lib/libvirt/images - - - - +C
