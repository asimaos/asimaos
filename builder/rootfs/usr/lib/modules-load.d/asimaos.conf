# Asima OS (D26): loaded at every start.
# NTSYNC: Windows-style sync for Proton and Wine (/dev/ntsync), smoother Windows games.
ntsync
# Virtual controllers for Steam Input (/dev/uinput; see udev/rules.d/70-asimaos-gaming.rules).
uinput
# The monitors' I2C buses (/dev/i2c-*), for their brightness over the cable (DDC/CI, D55; see
# udev/rules.d/70-asimaos-ddc.rules).
i2c-dev
# Virtual cameras (OBS Studio from Flathub can't load a module itself; D55).
v4l2loopback
