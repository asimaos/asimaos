; Asima OS: while a game runs GameMode, the controller-as-mouse service pauses
; (asimaos-gamemode-hook). The gaming CPU scheduler is on from the start (D44). Everything else is
; GameMode's default.
[custom]
start=/usr/lib/asimaos/asimaos-gamemode-hook start
end=/usr/lib/asimaos/asimaos-gamemode-hook end
script_timeout=10
