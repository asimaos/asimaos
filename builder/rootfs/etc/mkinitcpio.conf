# Asima OS initramfs: generic (shared across all machines), systemd-based.
# NOTE: no 'autodetect' hook on purpose: one UKI must boot on any hardware.
MODULES=(erofs dm_verity dm_crypt loop overlay btrfs isofs)
BINARIES=()
FILES=()
HOOKS=(base systemd plymouth microcode modconf keyboard sd-vconsole block sd-encrypt filesystems asimaos)
COMPRESSION="zstd"
