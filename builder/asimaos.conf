# Asima OS build configuration (sourced by build scripts)

# Pinned Arch Linux Archive snapshot (repeatable builds). systemd 262.2, linux 7.3.4.
ASIMAOS_ARCHIVE_DATE="2026/11/14"

# The OS name as people see it (os-release, the start-up screen).
ASIMAOS_NAME="Asima OS"

# Image version: YYYY.MM.DD.N (sortable by systemd-boot / systemd-sysupdate). The label is only
# shown inside the system (os-release VERSION), never in the start menu. Test builds of later
# versions (the update tests: a good V2, a broken V3) set ASIMAOS_VERSION_OVERRIDE.
ASIMAOS_VERSION="${ASIMAOS_VERSION_OVERRIDE:-2026.11.25.1}"   # .2 and .3: the update tests' versions
ASIMAOS_RELEASE="Beta 12"

# Updates that skip versions (D52): update files install on the versions of this window before
# them (their MIN_FROM) and carry every migration step since (builder/migrations). Older
# computers update with Asima Rescue or the USB stick's repair.
ASIMAOS_UPDATE_WINDOW="1 year"

# Size limits (D28 keeps the image lean): a build that grows past these fails, so growth
# is a decision. In MiB; the /usr image, the ISO and the update file are about 3900, 4300 and
# 3250.
ASIMAOS_LIMIT_USR_MB=4600
ASIMAOS_LIMIT_ISO_MB=5200
ASIMAOS_LIMIT_UPDATE_MB=4000

# Packages installed into the image (docs/architecture.md §11). One image, everything on for everyone (D6,
# D26). Only what must run natively is here (D28); GUI apps outside "KDE standard" come from Flathub
# (D4), terminal and developer tools from Nix or Distrobox.
ASIMAOS_PACKAGES=(
    # Boot, crypto, filesystems
    base linux linux-firmware amd-ucode intel-ucode mkinitcpio plymouth zram-generator
    btrfs-progs cryptsetup erofs-utils dosfstools exfatprogs mtools
    mokutil gnupg tpm2-tss tpm2-tools nvme-cli less sudo which nano man-db man-pages bash-completion
    # Hardware, audio, network, security, power
    pipewire pipewire-pulse pipewire-alsa pipewire-jack wireplumber rtkit sof-firmware alsa-ucm-conf
    networkmanager networkmanager-openvpn networkmanager-openconnect bluez bluez-utils bluez-obex
    fwupd power-profiles-daemon upower thermald powertop ddcutil i2c-tools
    apparmor nftables fprintd pam-u2f v4l-utils usbutils pciutils xdg-user-dirs ntfs-3g
    cups cups-browsed ipp-usb ghostscript avahi nss-mdns
    # Graphics (NVIDIA: open kernel modules, prebuilt by Arch for its standard kernel, D23)
    mesa vulkan-radeon vulkan-intel intel-media-driver libva-nvidia-driver
    nvidia-open nvidia-utils nvidia-prime switcheroo-control
    # Gaming plumbing (D5): GameMode, sched-ext schedulers and their loader (Asima Gaming), the
    # gaming-mouse service that Piper (Flathub) uses; game mode's compositor (D55) and the
    # handhelds' buttons and gyro (InputPlumber, D55)
    gamemode scx-scheds scx-tools libratbag gamescope inputplumber
    # Virtual CD/DVD drives for disc images (older games); its kernel module, vhba, comes from
    # stage 16 (D55)
    cdemu-daemon cdemu-client
    # Developer plumbing that must run on the system itself (41 c: compilers and IDEs come from
    # Distrobox, Nix or Flathub; gdb stays for crash reports)
    gdb strace perf python git openssh curl wget rsync jq ripgrep restic smartmontools
    # Virtualization, containers, Flatpak, Android apps (Waydroid), Nix (D28)
    qemu-desktop libvirt dnsmasq swtpm edk2-ovmf virtiofsd podman podman-docker podman-compose distrobox passt
    # Toolbx next to Distrobox, for Asima App Center's containers (D56)
    toolbox
    waydroid nix
    # Guest tools: Asima OS inside QEMU/KVM, VirtualBox, VMware or Hyper-V (D22)
    spice-vdagent phodav qemu-guest-agent virtualbox-guest-utils open-vm-tools hyperv
    flatpak fuse3 fuse2
    # Desktop: Plasma 6.8 = every member of plasma-meta except kup and plasma-firewall (D4)
    aurorae bluedevil breeze breeze-gtk discover drkonqi flatpak-kcm kactivitymanagerd kde-cli-tools
    kde-gtk-config kdecoration kdeplasma-addons kglobalacceld kinfocenter kmenuedit knighttime kpipewire
    krdp kscreen kscreenlocker ksshaskpass ksystemstats kwallet-pam kwayland kwin kwrited layer-shell-qt
    libkscreen libksysguard libplasma milou ocean-sound-theme oxygen oxygen-sounds plasma-activities
    plasma-activities-stats plasma-browser-integration plasma-desktop plasma-disks plasma-integration
    plasma-keyboard plasma-login-manager plasma-nm plasma-pa plasma-systemmonitor plasma-thunderbolt
    plasma-vault plasma-welcome plasma-workspace polkit-kde-agent powerdevil print-manager spectacle
    systemsettings union xdg-desktop-portal-kde
    # KDE standard apps (D4; KDevelop and Kompare come from Flathub since D28) and their helpers:
    # Dolphin's video and PDF previews, spell-checking
    dolphin konsole ark filelight kate okular gwenview elisa haruna kcalc kdeconnect
    kwalletmanager khelpcenter tesseract-data-eng ffmpegthumbs kdegraphics-thumbnailers hunspell-en_us
    # Fonts, languages, input methods, accessibility
    noto-fonts noto-fonts-cjk noto-fonts-emoji glibc-locales
    fcitx5 fcitx5-qt fcitx5-gtk fcitx5-configtool fcitx5-m17n fcitx5-chinese-addons fcitx5-mozc fcitx5-hangul
    orca espeak-ng
    # Archives
    7zip unzip zip
)

# Snap (D28): snapd built from this AUR revision (stage 12). Maintained by a snapd developer; its
# PKGBUILD pins snapd's release tarball by SHA-256.
# Extra kernel modules (stage 16, D55) not in Arch's packages: from their source at a pinned
# commit (checked), built against the image's kernel and signed with the build's key.
ASIMAOS_XPADNEO="https://github.com/atar-axis/xpadneo e8f103a77f777c2c54536dd947969cf228699c13 v0.10.5"
# Microsoft's Xbox Wireless Adapter (xone, D55), its adapter part only: every wired controller
# stays with the kernel's own xpad, so if xone ever stops building on a new kernel, only the
# adapter is affected.
ASIMAOS_XONE="https://github.com/dlundqvist/xone 30317da0e6ddedefdedde780d8b40be0dc7118ce master-2026-11-15"
ASIMAOS_SNAPD_AUR="271461cef2ccfc9092cca258513a86ed0523f816 snapd 2.78-1 (2026-10-14)"

# TEST-ONLY secrets for the prebuilt test disk image. Never used for real releases.
ASIMAOS_TEST_LUKS_PASSPHRASE="asimaos"
ASIMAOS_TEST_ROOT_PASSWORD="asimaos"
