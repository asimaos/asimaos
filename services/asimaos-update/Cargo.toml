[package]
name = "asimaos-update"
description = "The Asima OS update file format (.aosupd): pack, inspect, verify, install"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "aosupd"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
ed25519-dalek = "2"
hex.workspace = true
serde_json.workspace = true
sha2.workspace = true
zstd = { version = "0.13", features = ["zstdmt"] }
