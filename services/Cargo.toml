# Asima OS system services: small root daemons on the system D-Bus, authorised with polkit.
# The GUIs (apps/) never run as root; every privileged action goes through one of these. One
# service per app, so each app and its service can be finished and left alone on their own.
[workspace]
resolver = "2"
members = ["asimaos-svc", "asimaos-update", "asimaos-engine", "asimaos-updaterd", "asimaos-maintenanced", "asimaos-managerd", "asimaos-gamingd", "asimaos-faced"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
hex = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "time", "sync"] }
futures-util = "0.3"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
