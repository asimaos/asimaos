<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- asimaos-faced: only root may own the name. Enrolling is per caller (polkit
     io.github.asimaos.face.enroll); VerifyFor answers only root or the person themself; AdminToken
     answers only the Asima OS password dialog, ConsumeToken only root (the service checks). -->
<busconfig>
  <policy user="root">
    <allow own="io.github.asimaos.Face1"/>
  </policy>
  <policy context="default">
    <allow send_destination="io.github.asimaos.Face1"/>
  </policy>
</busconfig>
