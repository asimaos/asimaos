<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- asimaos-updaterd: only root may own the name; anyone may call it. Every change is
     authorised per call with polkit (io.github.asimaos.updater.*), reading needs nothing. -->
<busconfig>
  <policy user="root">
    <allow own="io.github.asimaos.Updater1"/>
  </policy>
  <policy context="default">
    <allow send_destination="io.github.asimaos.Updater1"/>
  </policy>
</busconfig>
